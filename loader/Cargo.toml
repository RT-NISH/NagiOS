[package]
name = "nagi-loader"
version = "0.1.0"
edition = "2021"
publish = false
autobins = false

[workspace]

[features]
m27-ab-slot-boot-control = ["dep:nagi-slot-manifest"]
m27-ab-slot-acceptance = ["m27-ab-slot-boot-control"]

[lib]
path = "src/lib.rs"
test = true

[[bin]]
name = "nagi-loader"
path = "src/main.rs"
test = true
bench = false

[dependencies]
nagi-bootinfo = { path = "../crates/nagi-bootinfo" }
nagi-slot-manifest = { path = "../crates/nagi-slot-manifest", optional = true }

[target.'cfg(target_os = "uefi")'.dependencies]
uefi = { version = "=0.37.0", features = ["panic_handler"] }
