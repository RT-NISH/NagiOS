[workspace]

[package]
name = "nagi-bootstrap"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
nagi-model-manager = { path = "../../user/nagi-model-manager" }
nagi-slot-manifest = { path = "../../crates/nagi-slot-manifest", features = ["sign"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "=0.10.9", default-features = false }

[lib]
name = "nagi_cli"
path = "../nagi-cli/src/lib.rs"

[[bin]]
name = "nagi-bootstrap"
path = "../nagi-cli/src/main.rs"
