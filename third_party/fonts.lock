format_version = 1

# Exact system-font pins for Nagi 0.1 (ADR 0045). `./nagi fetch` downloads
# each file into the ignored `out/cache/fonts/` cache and refuses any byte
# that does not match `size_bytes` and `sha256`. Files with `guest_path` are
# compiled into the Servo-enabled init image and published read-only at that
# path; license texts accompany them in the cache and the image.

[fonts.noto_sans_regular]
component = "noto-sans"
family = "Noto Sans"
repository = "https://github.com/notofonts/notofonts.github.io"
revision = "86eb2ddc3a2e97cb9747fd9069ee5d47880e3305"
url = "https://raw.githubusercontent.com/notofonts/notofonts.github.io/86eb2ddc3a2e97cb9747fd9069ee5d47880e3305/fonts/NotoSans/hinted/ttf/NotoSans-Regular.ttf"
file_name = "NotoSans-Regular.ttf"
size_bytes = 621572
sha256 = "478c558ea716033cd60c03438f628dfa75694dcf6b5f6d505a2f05fd2b4f3823"
license = "OFL-1.1"
guest_path = "/system/fonts/NotoSans-Regular.ttf"

