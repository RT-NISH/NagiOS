[package]
name = "nagi-embedding-provider"
version = "0.1.0"
edition = "2021"
publish = false
description = "Model-backed EmbeddingProvider for Nagi OS 0.1 M24 (multilingual-e5-small, Nagi-owned no_std encoder)"
license = "MIT OR Apache-2.0"

# Standalone crate: it stays outside the root workspace until an integration
# owner registers it. It depends read-only on the canonical 0.1 Search
# contract by path and never copies or forks it.
[workspace]

[features]
default = ["std"]
# Host conveniences: loading an artifact from a path and a monotonic clock for
# inference deadlines. The inference core is no_std + alloc.
std = []

[dependencies]
nagi-search = { path = "../../user/nagi-search" }
libm = { version = "0.2", default-features = false }
sha2 = { version = "0.10", default-features = false }
unicode-segmentation = { version = "1", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("nagi"))'] }

# Real inference over a 470 MB artifact is impractically slow unoptimized.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 3

[[test]]
name = "m24-embedding-contract"
path = "../../tests/m24-embedding/contract.rs"

[[test]]
name = "m24-embedding-real-inference"
path = "../../tests/m24-embedding/real_inference.rs"

[dev-dependencies]
nagi-model = { path = "../nagi-model" }

[[test]]
name = "m24-embedding-adversarial"
path = "../../tests/m24-embedding/adversarial.rs"
