[package]
name = "nagi-identity-session"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
members = ["."]
resolver = "2"

[dependencies]
nagi-capability = { path = "../nagi-capability" }
nagi-model = { path = "../nagi-model" }
