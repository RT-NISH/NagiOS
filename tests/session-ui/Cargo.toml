[package]
name = "nagi-session-ui-tests"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
desktop-check = ["m20-model-service"]
m20-model-service = ["production-session", "desktop-login", "m19-runtime"]
production-session = []
desktop-login = []
m19-runtime = []
m19-files-search-production = []
m19-search = []
m10-desktop = []
m29-settings-acceptance = []
desktop-login-acceptance = []
desktop-password-change-acceptance = []
consent-dialog = []
consent-dialog-acceptance = []

[dependencies]
libnagi = { path = "../../user/libnagi" }
nagi-model-manager = { path = "../../user/nagi-model-manager" }
nagi-model = { path = "../../crates/nagi-model" }
nagi-posix = { path = "../../user/nagi-posix", features = ["m20-llama-memory"] }
nagi-localization = { path = "../../user/nagi-localization" }

nagi-ui = { path = "../../user/nagi-ui" }
nagi-search = { path = "../../user/nagi-search" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("nagi"))'] }
