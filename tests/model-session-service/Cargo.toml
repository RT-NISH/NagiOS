[package]
name = "nagi-model-session-service-check"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
default = ["m20-model-service"]
m20-model-service = []
granite-acceptance = []

[dependencies]
libnagi = { path = "../../user/libnagi" }
nagi-model = { path = "../../crates/nagi-model" }
nagi-model-manager = { path = "../../user/nagi-model-manager" }
nagi-posix = { path = "../../user/nagi-posix", features = ["m20-llama-memory"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("nagi"))'] }
