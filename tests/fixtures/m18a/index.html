<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Nagi M18A Controlled Remote Fixture</title>
</head>
<body style="margin:0;background:#315d47;color:#f7f3e8;font:24px sans-serif;display:grid;place-items:center">
  <main>Nagi M18A remote fixture</main>
  <script>
    fetch("/upload", {
        method: "POST",
        headers: { "Content-Type": "application/octet-stream" },
        body: "nagi-m18a-upload"
      }).then(response => response.text()).then(upload =>
        fetch("/download").then(response => {
        if (!response.ok || !response.headers.get("Content-Disposition").startsWith("attachment")) {
          throw new Error("fixture download failed");
        }
        return response.text().then(download => [upload, download]);
      })
      ).then(([upload, download]) => {
      if (upload !== "upload received: nagi-m18a-upload" || download !== "nagi-m18a-download") {
        throw new Error("fixture transfer body mismatch");
      }
      return fetch("https://10.0.2.2:18444/tls-probe", { mode: "cors" }).then(
        () => { throw new Error("untrusted TLS certificate was accepted"); },
        () => {
          document.title = "Nagi M18A Controlled Remote Fixture TLS Failure PASS";
          document.querySelector("main").textContent = "Nagi M18A HTTPS transfers and TLS rejection PASS";
        }
      );
    }).catch(() => {
      document.title = "Nagi M18A Controlled Remote Fixture Transfers FAIL";
    });
  </script>
</body>
</html>
