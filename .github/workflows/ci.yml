name: Nagi CI

on:
  push:
    paths-ignore:
      - '.dev/workstreams/**/state.json'
      - 'docs/implementation_status.md'
  pull_request:
    paths-ignore:
      - '.dev/workstreams/**/state.json'
      - 'docs/implementation_status.md'

permissions:
  contents: read

jobs:
  ubuntu-host:
    concurrency:
      group: nagi-ci-ubuntu-host-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install supported host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang clang-19 lld lld-19 qemu-system-x86 ovmf cmake meson ninja-build python3
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-19 190
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-19 190
          sudo update-alternatives --install /usr/bin/lld lld /usr/bin/lld-19 190
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install nightly-2025-08-01 --profile minimal --component rustfmt --component clippy --component rust-src
          rustup target add --toolchain nightly-2025-08-01 x86_64-unknown-uefi
      - name: Bootstrap pinned Servo source dependencies
        run: cargo run --locked --manifest-path tools/nagi-bootstrap/Cargo.toml -p nagi-bootstrap -- fetch
      - name: Format
        run: |
          cargo fmt --package nagi-cli --package nagi-idl --package nagi-bootinfo --package nagi-abi --package nagi-model --package nagi-localization --package nagi-model-manager --package nagi-kernel --package libnagi --package nagi-net --package nagi-pal --package nagi-posix --package nagi-audio --package nagi-history --package nagi-servo-adapter --package nagi-init --package nagi-ui --package nagi-package --package nagi-sdk -- --check
          cargo fmt --manifest-path tools/nagi-pkg/Cargo.toml -- --check
          cargo fmt --manifest-path loader/Cargo.toml -- --check
          rustfmt --check user/nagi-albert/src/lib.rs
      - name: Regression tests for CI diagnostic parsers
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Lint host-compatible workspace
        run: cargo clippy --workspace --all-targets --exclude nagi-kernel --locked -- -D warnings
      - name: Build host-compatible workspace
        run: cargo build --workspace --exclude nagi-kernel --locked
      - name: Test host-compatible workspace
        run: cargo test --workspace --exclude nagi-kernel --locked
      - name: Focused host acceptance (M0)
        run: ./nagi test --acceptance --host-only --ci
      - name: Upload Ubuntu acceptance reports and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-ubuntu-host-${{ github.run_attempt }}
          path: |
            out/test-results/
            out/logs/acceptance/
          if-no-files-found: ignore
      - name: Verify development workstream state
        run: ./nagi dev verify
  windows-launcher:
    concurrency:
      group: nagi-ci-windows-launcher-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 30
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install nightly-2025-08-01 --profile minimal --component rustfmt --component clippy --component rust-src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add --toolchain nightly-2025-08-01 x86_64-unknown-uefi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bootstrap pinned Servo source dependencies
        shell: pwsh
        run: |
          cargo run --locked --manifest-path tools/nagi-bootstrap/Cargo.toml -p nagi-bootstrap -- fetch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build host-compatible workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --workspace --exclude nagi-kernel --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test host-compatible workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test --workspace --exclude nagi-kernel --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Windows launcher help
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\nagi.ps1 --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify truthful missing-dependency mode
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\nagi.ps1 doctor --allow-missing
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Focused Windows host acceptance (M0 launcher)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\nagi.ps1 test --acceptance --host-only --subsystem developer-cli --ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify development workstream state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\nagi.ps1 dev verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows acceptance reports and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-windows-host-${{ github.run_attempt }}
          path: |
            out/test-results/
            out/logs/acceptance/
          if-no-files-found: ignore
  nagi-target:
    needs: [ubuntu-host, windows-launcher]
    concurrency:
      group: nagi-ci-target-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 120
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install target build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang clang-19 lld lld-19 llvm libc++-19-dev qemu-system-x86 ovmf cmake meson ninja-build python3 python3-venv flex bison build-essential
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-19 190
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-19 190
          sudo update-alternatives --install /usr/bin/lld lld /usr/bin/lld-19 190
      - name: Install pinned Rust target toolchain
        run: |
          rustup toolchain install nightly-2025-08-01 --profile minimal --component rustfmt --component clippy --component rust-src
          rustup target add --toolchain nightly-2025-08-01 x86_64-unknown-uefi
      - name: Prepare patched Nagi Rust std source
        run: |
          sysroot=$(rustc +nightly-2025-08-01 --print sysroot)
          mkdir -p out/rust-src
          cp -a "$sysroot/lib/rustlib/src/rust/." out/rust-src/
          git apply --unsafe-paths --whitespace=nowarn --directory=out/rust-src third_party/rust-std/patches/0001-nagi-target-support.patch
          if ! grep -q '^libc = { path = "../../../third_party/libc" }$' out/rust-src/library/Cargo.toml; then
            printf '\nlibc = { path = "../../../third_party/libc" }\n' >> out/rust-src/library/Cargo.toml
          fi
      - name: Install pinned Mesa generators
        run: |
          python3 -m venv out/mesa-venv
          out/mesa-venv/bin/python -m pip install --requirement tools/mesa/requirements.txt
          cargo install cbindgen --version 0.28.0 --locked
      - name: Bootstrap pinned Servo source
        run: |
          set -o pipefail
          mkdir -p out/logs
          set +e
          cargo run --locked --manifest-path tools/nagi-bootstrap/Cargo.toml -p nagi-bootstrap -- fetch 2>&1 | tee out/logs/m17-bootstrap.log
          bootstrap_status=${PIPESTATUS[0]}
          set -e
          if [ "$bootstrap_status" -ne 0 ]; then
            first_error=$(grep -m1 -E '(^FAIL |^error:|patch check failed|patch application failed|fingerprint|source hash|cannot |refusing )' out/logs/m17-bootstrap.log || true)
            if [ -z "$first_error" ]; then
              first_error=$(tail -n 30 out/logs/m17-bootstrap.log | tr '\n' ' ' | cut -c1-3000)
            fi
            first_error=${first_error//$'\r'/'%0D'}
            first_error=${first_error//$'\n'/'%0A'}
            echo "::error title=M17 Servo bootstrap diagnostic::$first_error"
          fi
          exit "$bootstrap_status"
      - name: Verify M17 target dependency feature boundary
        run: |
          graph=$(cargo +nightly-2025-08-01 tree --locked --package nagi-init --features m17-servo --target targets/x86_64-unknown-nagi-user.json --edges normal --prefix none --format '{p}')
          printf '%s\n' "$graph"
          if printf '%s\n' "$graph" | grep -E '^(warp|servo-webdriver-server|libloading|dlib|wayland-sys|rustix) v' >/dev/null; then
            echo 'M17 Nagi target graph must not include WebDriver server, host display-loader, or Unix rustix dependencies' >&2
            exit 1
          fi
      - name: Build pinned Nagi Mesa Softpipe archive
        run: |
          source out/mesa-venv/bin/activate
          bash tools/mesa/build.sh
      - name: Fetch standalone package and UEFI dependencies
        run: |
          cargo fetch --manifest-path tools/nagi-pkg/Cargo.toml --locked
          cargo fetch --manifest-path loader/Cargo.toml --target x86_64-unknown-uefi --locked
      - name: Build M16 package artifact
        run: |
          mkdir -p out/artifacts
          cargo build --manifest-path samples/hello-nagi/Cargo.toml --offline --locked
          cargo run --manifest-path samples/hello-nagi/Cargo.toml --bin hello-nagi-package --offline --locked -- out/artifacts/hello-nagi.napp
          cargo run --manifest-path tools/nagi-pkg/Cargo.toml --offline --locked -- build-hello out/artifacts/hello-nagi.napp out/artifacts/hello-nagi.xapp
      - name: Build Nagi kernel
        run: cargo +nightly-2025-08-01 build -p nagi-kernel --target targets/x86_64-unknown-nagi.json -Zbuild-std=core,compiler_builtins --release --locked
      - name: Build Nagi user init
        env:
          NAGI_TARGET_CLANG: clang-19
          NAGI_CXX_HEADERS: /usr/include/c++/v1
          NAGI_M16_PACKAGE: ${{ github.workspace }}/out/artifacts/hello-nagi.xapp
          NAGI_MESA_BUILD: ${{ github.workspace }}/out/m17-mesa/mesa-build
          CC_x86_64_unknown_nagi_user: ${{ github.workspace }}/tools/nagi-target-cc.sh
          CXX_x86_64_unknown_nagi_user: ${{ github.workspace }}/tools/nagi-target-cc.sh
          __CARGO_TESTS_ONLY_SRC_ROOT: ${{ github.workspace }}/out/rust-src/library
        run: |
          set -o pipefail
          mkdir -p out/logs
          set +e
          cargo +nightly-2025-08-01 build -p nagi-init --features m17-servo --target targets/x86_64-unknown-nagi-user.json -Zbuild-std=std,panic_abort --release --locked 2>&1 | tee out/logs/m17-nagi-user-init.log
          cargo_status=${PIPESTATUS[0]}
          set -e
          if [ "$cargo_status" -ne 0 ]; then
            first_error=$(grep -m1 -E '(^|[[:space:]])error(\[[A-Z][0-9]+\])?:' out/logs/m17-nagi-user-init.log || true)
            first_location=""
            build_detail=""
            if [ -n "$first_error" ]; then
              error_line=$(grep -n -m1 -E '(^|[[:space:]])error(\[[A-Z][0-9]+\])?:' out/logs/m17-nagi-user-init.log | cut -d: -f1 || true)
              if [ -n "$error_line" ]; then
                error_end=$((error_line + 12))
                first_location=$(sed -n "${error_line},${error_end}p" out/logs/m17-nagi-user-init.log | grep -m1 -E '^[[:space:]]*-->' || true)
              fi
            fi
            if [[ "$first_error" == *"linking with"* ]]; then
              python3 tools/nagi-target-link-diagnostics.py \
                --log out/logs/m17-nagi-user-init.log \
                --inventory out/logs/m17-undefined-symbols.txt \
                --summary "$GITHUB_STEP_SUMMARY" \
                --search-root target/x86_64-unknown-nagi-user/release/build \
                --search-root target/x86_64-unknown-nagi-user/release/deps \
                --search-top-level out/m17-mesa \
                || echo '::warning title=M17 linker inventory::Could not complete symbol/provider diagnostics'
              symbol_count=0
              if [ -f out/logs/m17-undefined-symbols.txt ]; then
                symbol_count=$(wc -l < out/logs/m17-undefined-symbols.txt | tr -d ' ')
              fi
              first_error="$first_error [$symbol_count unique undefined symbols; full inventory is in the job summary and build log]"
            fi
            if [[ "$first_error" == *"failed to run custom build command"* ]]; then
              build_detail=$(grep -m5 -E 'nagi-cxx-runtime\.cpp:[0-9]+|fatal error:|clang(\+\+)?[^:]*: error:|rust-lld: error|undefined (symbol|reference)|could not compile' out/logs/m17-nagi-user-init.log | paste -sd '; ' - || true)
            fi
            if [ -n "$first_error" ]; then
              if [ -n "$first_location" ]; then
                first_error="$first_error ($first_location)"
              fi
              if [ -n "$build_detail" ]; then
                first_error="$first_error [$build_detail]"
              fi
              first_error=${first_error//'%'/'%25'}
              first_error=${first_error//$'\r'/'%0D'}
              first_error=${first_error//$'\n'/'%0A'}
              echo "::error title=M17 target first compiler diagnostic::$first_error"
            else
              echo '::error title=M17 target build::Build Nagi user init failed without a parsed compiler diagnostic; inspect the cargo output above'
            fi
          fi
          exit "$cargo_status"
      - name: Build UEFI loader
        run: cargo +nightly-2025-08-01 build --manifest-path loader/Cargo.toml --target x86_64-unknown-uefi --release --locked
      - name: M17 first web pixel acceptance
        env:
          NAGI_TARGET_CLANG: clang-19
          NAGI_CXX_HEADERS: /usr/include/c++/v1
        run: |
          source out/mesa-venv/bin/activate
          ./nagi test --acceptance --target-only --milestone M17 --ci
      - name: Capture target runner resource state
        if: always()
        run: |
          mkdir -p out/logs
          {
            date -u
            uname -a
            free -h
            df -h .
            cat /proc/meminfo
          } > out/logs/m17-runner-resources.log 2>&1
      - name: Upload M17 diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m17-diagnostics-${{ github.run_id }}
          path: out/logs/m17-*
          if-no-files-found: error
          retention-days: 30
      - name: Upload target acceptance reports and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-nagi-target-${{ github.run_attempt }}
          path: |
            out/test-results/
            out/logs/acceptance/
            out/logs/m17-runner-resources.log
            out/logs/m17-bootstrap.log
            out/logs/m17-nagi-user-init.log
            out/logs/m17-undefined-symbols.txt
            out/logs/m17-servo.log
          if-no-files-found: ignore
