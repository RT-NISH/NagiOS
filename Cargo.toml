[workspace]
resolver = "2"
members = [
    "tools/nagi-cli",
    "tools/nagi-idl",
    "crates/nagi-bootinfo",
    "crates/nagi-abi",
    "crates/nagi-model",
    "crates/nagi-localization",
    "kernel",
    "user/libnagi",
    "user/nagi-net",
    "user/nagi-pal",
    "user/nagi-posix",
    "user/nagi-audio",
    "user/nagi-history",
    "user/nagi-package",
    "user/nagi-model-manager",
    "user/nagi-servo",
    "user/nagi-init",
]
default-members = [
    "tools/nagi-cli",
    "crates/nagi-bootinfo",
]
exclude = ["third_party/relibc", "third_party/servo"]

# Servo's pinned libc is materialized and patched by `nagi fetch`. Keep the
# parent workspace on that same Nagi-owned source when the target-local Servo
# graph is selected; the nested Servo workspace patch is not inherited by this
# workspace's resolver.
[patch.crates-io]
cc = { path = "third_party/cc-nagi" }
libc = { path = "third_party/libc-servo" }
freetype-sys = { path = "third_party/freetype-sys" }
hyper-util = { path = "third_party/hyper-util-servo" }
mio = { path = "third_party/mio-servo" }
socket2 = { path = "third_party/socket2-servo" }
tempfile = { path = "third_party/tempfile-nagi" }
mozjs_sys = { path = "third_party/mozjs-sys-nagi" }
tokio = { path = "third_party/tokio-servo" }
surfman = { path = "third_party/surfman" }
