[package]
name = "nagi-net"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
libnagi = { path = "../libnagi" }
smoltcp = { version = "=0.12.0", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "proto-dhcpv4",
    "proto-dns",
    "socket-icmp",
    "socket-udp",
    "socket-tcp",
    "socket-dhcpv4",
    "socket-dns",
] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("nagi"))'] }
