[package]
name = "nagi-history"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
sandbox = []

[[example]]
name = "activity_wayback_preview"
path = "examples/activity_wayback_preview.rs"
required-features = ["sandbox"]

[dependencies]
nagi-model = { path = "../../crates/nagi-model" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("nagi"))'] }
