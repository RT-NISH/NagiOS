[package]
name = "libnagi"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = []
m18-browser-threads = ["nagi-abi/m18-browser-threads"]

[dependencies]
nagi-abi = { path = "../../crates/nagi-abi" }
nagi-model = { path = "../../crates/nagi-model" }
sha2 = { version = "=0.10.9", default-features = false }

[target.'cfg(target_os = "nagi")'.dependencies]
getrandom = "0.4.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("nagi"))'] }
