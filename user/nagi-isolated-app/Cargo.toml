[package]
name = "nagi-isolated-app"
version = "0.1.0"
edition = "2021"
publish = false

# Minimal application launched by the Supervisor into its own address space
# (ADR 0043). It uses raw Nagi syscalls only: no allocator, no TLS, and no
# device capabilities.

[[bin]]
name = "nagi-isolated-app"
path = "src/main.rs"
test = false
bench = false

[dependencies]
nagi-abi = { path = "../../crates/nagi-abi" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("nagi"))'] }
